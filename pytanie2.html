<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>made by Kuba M + 1A:)</title>
    <style>
        body {
            background-color: #fff8dc;
            color: #333333;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 40px 20px;
        }

        h1 {
            background-color: #deb887;
            font-size: 30px;
            margin-bottom: 25px;
            padding: 15px;
            border-radius: 4px;
        }

        .buttons {
            margin-bottom: 25px;
        }

        button {
            background-color: #dc143c;
            color: white;
            border: none;
            padding: 15px 24px;
            font-size: 16px;
            margin: 14px;
            cursor: pointer;
            border-radius: 4px;
        }

        button:disabled {
            background-color: #000000;
            cursor: not-allowed;
        }

        #wynik {
            font-size: 45px;
            font-weight: bold;
            margin-top: 20px;
            min-height: 40px;
            color: #000000;
        }
    </style>
</head>
<body>

    <h1 id="tytul-pytania">Kto stanął na czele państwa polskiego jako naczelnik w listopadzie 1918 roku?</h1>

    <div class="buttons" id="kontener-przyciskow">
        <button onclick="wybierz(false, 'Zła odpowiedź, był to Józef Piłsudski.')">Ignacy Jan Paderewski</button>
        <button onclick="wybierz(true, '&bdquo;ułani&rdquo;')">Józef Piłsudski</button>
        <button onclick="wybierz(false, 'Zła odpowiedź, był to Józef Piłsudski.')">Roman Dmowski</button>
    </div>

    <div id="wynik"></div>

    <script>
        // Unikalny klucz dla stacji 2, żeby pamięć przeglądarki się nie mieszała
        var kluczZapisu = "stacja_2_haslo_v200";

        window.onload = function() {
            var zapisaneHaslo = localStorage.getItem(kluczZapisu);
            if (zapisaneHaslo) {
                document.getElementById('tytul-pytania').innerText = "Już wybrałeś/aś odpowiedź";
                document.getElementById('kontener-przyciskow').style.display = 'none';
                
                // Sprawdzamy czy zapisane hasło to nasze poprawne hasło (w różnych formatach cudzysłowów)
                if (zapisaneHaslo === '&bdquo;ułani&rdquo;' || zapisaneHaslo === '„ułani”') {
                    document.getElementById('wynik').innerHTML = "Hasło nr. 2:<br><span style='font-size: 65px;'>&bdquo;ułani&rdquo;</span>";
                } else {
                    document.getElementById('wynik').innerHTML = "<span style='font-size: 24px;'>" + zapisaneHaslo + "</span>";
                }
            }
        };

        function wybierz(czyPoprawna, komunikat) {
            var wynikDiv = document.getElementById('wynik');
            
            if (czyPoprawna) {
                wynikDiv.innerHTML = "Poprawna odpowiedź,<br> Hasło nr. 2 to: <strong>" + komunikat + "</strong>";
                localStorage.setItem(kluczZapisu, komunikat);
            } else {
                wynikDiv.style.fontSize = "24px";
                wynikDiv.innerText = komunikat;
                localStorage.setItem(kluczZapisu, komunikat);
            }
            
            var przyciski = document.querySelectorAll('button');
            for (var i = 0; i < przyciski.length; i++) {
                przyciski[i].disabled = true;
            }
        }
    </script>

</body>
